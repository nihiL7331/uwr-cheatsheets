name: Build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.14.2

      - name: List available fonts
        run: typst fonts --font-path fonts/ --variants

      - name: Debug fonts
        run: |
          git ls-files fonts/
          file fonts/* fonts/**/* 2>/dev/null | grep -v directory

      - name: Compile
        run: |
          BASE_DIR="letnie/ask_architektury-systemow-komputerowych"
          SRC_FILE="$BASE_DIR/cheatsheet.typ"
          MAX_LECTURE=15

          for i in $(seq 1 $MAX_LECTURE); do
            FOLDER_NUM=$(printf "%02d" $i)
            OUT_DIR="$BASE_DIR/w$FOLDER_NUM"

            mkdir -p "$OUT_DIR"

            typst compile --ignore-system-fonts --input od=1 --input do=$i \
              -f pdf --font-path fonts/ "$SRC_FILE" "$OUT_DIR/cheatsheet.pdf" \
              2> >(tee /tmp/warn.log >&2)
            if grep -q "unknown font family" /tmp/warn.log; then exit 1; fi
          done

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-update ask pdf artifacts"
          file_pattern: "letnie/ask_architektury-systemow-komputerowych/w*/*.pdf"
