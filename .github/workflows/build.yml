name: Build
on:
  push:
    branches:
      - source
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.14.2

      - name: List available fonts
        run: typst fonts --font-path fonts/ --variants

      - name: Debug fonts
        run: |
          git ls-files fonts/
          file fonts/* fonts/**/* 2>/dev/null | grep -v directory

      - name: Compile
        run: python3 .github/scripts/build.py

      - name: Temporarily store artifacts
        run: |
          mkdir -p /tmp/pdf-artifacts
          find letnie obowiazki -name "*.pdf" -exec cp --parents {} /tmp/pdf-artifacts/ \; 2>/dev/null || true

      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          lfs: true

      - name: Restore artifacts
        run: |
          if [ -d /tmp/pdf-artifacts ]; then
            cp -r /tmp/pdf-artifacts/* ./
            rm -rf /tmp/pdf-artifacts
          fi

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: build pdf artifacts"
          file_pattern: "*/**/*.pdf"
